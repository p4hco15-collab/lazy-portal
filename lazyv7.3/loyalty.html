<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaZy | Points system</title>
    <script type="text/javascript">
      var cachebust = Math.round(new Date().getTime() / 1000);
      document.write('<scr'+'ipt defer src="./assets/core/core.js?v='+cachebust+'"></scr'+'ipt>');
      document.write('<scr'+'ipt defer src="./assets/js/config.js?v='+cachebust+'"></scr'+'ipt>');
    </script>
    
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif}input{display:block;width:100%;padding:10px;border:2px solid #ccc;border-radius:3px}input[type='submit']{margin-top:20px;background-color:#333;color:#fff;border:0}.inputs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;padding:1em;display:grid;gap:20px}#toggleForm{float:right;margin-top:10px;border:0;background:0;text-decoration:underline}#loyal_form,#insert_key{display:grid;gap:10px}.title{font-size:1.5rem;opacity:.8}label{opacity:.8}#card{padding:1em;max-width:500px;margin:auto}.card-info{background-color:#333;color:#fff;border-radius:6px;padding:1em}#redeemButtons{margin-top:20px}#rdeemButtons{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px 5px;grid-template-areas:'. .' '. .'}#rdeemButtons{margin-top:8px}.redeemPointsButton{padding:8px;border:0;background-color:#0c97a3;border-radius:6px;color:#fff;cursor:pointer}#history{display:flex;flex-direction:column;margin-top:20px}.history-name{font-size:1.2rem;font-weight:600}.history-info{font-size:.8rem;opacity:.8}.history-data{margin-top:10px;padding-bottom:10px;border-bottom:1px solid #ccc}.history-data p:first-child{font-size:.9rem;font-weight:600}.history-data p:nth-child(2){font-size:.7rem;opacity:.8}.loader{width:100%;height:20px;background:linear-gradient(90deg,#0001 33%,#0005 50%,#0001 66%) #333;background-size:300% 100%;animation:l1 1s infinite linear}@keyframes l1{0%{background-position:right}}#toast{position:absolute;top:0;right:0;z-index:9999}.toast-notification{min-width:200px;border-radius:5px;margin-top:5px;margin-right:5px;z-index:1;display:flex;flex-direction:row}.message-container{width:100%;padding:10px;color:white;text-align:left}.message-container p:first-child{margin-bottom:5px;border-bottom:2px solid #ffffff2b;font-size:small}.alert{position:absolute;top:0;left:50%;transform:translate(-50%,-50%) scale(0);background-color:#fff;padding:1rem;border-radius:6px;box-shadow:1px 2px 5px rgba(0,0,0,0.5);width:100%;max-width:300px;text-align:center;transition:.3s}.show{top:50%;transform:translate(-50%,-50%) scale(1)}#notif1{font-size:1.2rem;font-weight:600}#notif2{font-size:1rem;opacity:.8;margin-top:10px}.alert div:last-child{margin-top:25px;width:100%}#okay_button{width:100%;font-size:1rem;padding:.5rem;border:0;background-color:#0c97a3;border-radius:6px;color:#fff;cursor:pointer}#signup,#insertkey,#card{display:none}
    </style>
  </head>
  <body>
    <div id="toast"></div>
    <div class="inputs" id="signup">
      <span class="title">Sign up</span>
      <form name="loyal_form" id="loyal_form">
        <div class="input-group">
          <label for="Name">Name</label>
          <input type="text" name="name" title="name" required />
        </div>
        <div class="input-group">
          <label for="Mobile number">Mobile number</label>
          <input
            type="number"
            name="mobile"
            title="number"
            maxlength="11"
            required
          />
        </div>
        <div class="input-group">
          <label for="Email">Email</label>
          <input type="email" name="email" title="email" required />
        </div>
        <input type="submit" value="Submit" />
      </form>
      <button type="button" id="toggleForm">Already have key?</button>
    </div>

    <div class="inputs" id="insertkey">
      <form name="insert_key" id="insert_key">
        <div class="input-group">
          <label for="Key">User key</label>
          <input type="text" name="key" title="key" required />
        </div>
        <input type="submit" value="Submit" />
      </form>
    </div>

    <div class="card" id="card">
      <div class="card-info">
        <div id="name"><div class="loader"></div></div>
        <div id="points"><div class="loader"></div></div>
        <div id="ukey-info" style="display: none"></div>
        <div id="card-toggle-div" style="display: flex; justify-content: end;"></div>
      </div>
      <div id="redeemButtons"></div>
      <div id="history"></div>
    </div>

    <div class="alert">
      <div id="notif1"></div>
      <div id="notif2"></div>
      <div>
          <button type="button" id="okay_button">Okay</button>
      </div>
    </div>
    <script type="text/javascript">
      var cachebust = Math.round(new Date().getTime() / 1000);
      document.write('<scr'+'ipt defer src="./assets/core/loyalty.js?v='+cachebust+'"></scr'+'ipt>');
    </script>
  </body>
</html>
