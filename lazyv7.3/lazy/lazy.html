<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="pragma" content="no-cache" /> 
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Portal Admin</title>
    <link href="https://fonts.cdnfonts.com/css/roboto" rel="stylesheet">
    <script src="../assets/js/config.js"></script>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto Light',sans-serif}.main-container{padding:1rem;background-color:#fff}.wrapper-title{margin-bottom:1rem}.container{max-width:3000px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;transition:.2s}.container2{margin-top:1rem;max-width:3000px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem;transition:.2s}.data-div{border:2px solid #eee;background-color:#faf9f6;color:#333;padding:.5rem;border-radius:6px}.data-div p:first-child{font-size:1.2rem;opacity:.8;margin-bottom:.6rem}#sum_daily,#sum_monthly{font-size:.9rem}#active_user,#total_user{font-size:1.2rem}.btn-link-wrapper{margin-top:1.5rem}.btn-link{text-decoration:none;background-color:#333;color:#fff;padding:.5rem;border-radius:3px}#total_user_div,#total_active_div{cursor:pointer;transition:.3s}#total_user_div:hover,#total_active_div:hover{background-color:#333;border:2px solid #333;color:#fff}.vendo-wrapper,.client-wrapper{border:2px solid #eee;padding:.5rem;border-radius:6px;background-color:#faf9f6;font-size:.8rem}.vendo-wrapper p:first-child{opacity:.8}.vendo-wrapper p:nth-child(2),.vendo-wrapper p:last-child{font-weight:600;opacity:.8}.sale-div{padding:1rem;border:2px solid #eee;border-radius:6px;margin-top:1rem;background-color:#faf9f6}.total_sale_wrapper{display:flex;justify-content:space-around}h4{opacity:.7}.client-wrapper{display:grid;gap:1rem}.loyal_name{font-size:1rem;text-transform:capitalize}.reset-btn{border:0;background-color:#f5cd30;display:flex;align-items:center;justify-content:center;padding:.2rem .8rem;border-radius:3px;cursor:pointer;float:right;margin-right:10px}.reset-btn svg{color:#fff;width:25px;height:25px}.delete-btn{border:0;background-color:crimson;display:flex;align-items:center;justify-content:center;padding:.2rem .8rem;border-radius:3px;cursor:pointer;float:right}.delete-btn svg{color:#fff;width:25px;height:25px}.loyal-points{background-color:#efefef;padding-left:.3rem;padding-right:.3rem}.loader{width:25px;height:25px;background-color:#faf9f6;border:5px solid #d6d6d6;border-top:5px solid #faf9f6;border-radius:50%;animation:spin 2s infinite linear}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.hide{display:none}#login-form-container{position:fixed;top:0;left:0;width:100%;height:100%;background:0;backdrop-filter:blur(2px);z-index:999}#login-form{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;gap:10px;background-color:#fff;padding:1em;width:100%;max-width:290px;box-shadow:1px 2px 10px rgba(0,0,0,0.5);border-radius:3px}#login-form input{width:100%;padding:.8em;border:2px solid #e2e2e2;font-size:1rem;color:#333;border-radius:3px}#login-form input[type=submit]{background-color:#333;color:#fff;border-color:#333}.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background-color:#e7e6e6;margin:0;width:100%;height:100%;display:none;overflow:auto}#modal_footer{position:sticky;bottom:0;left:0;width:100%;background-color:#fff;text-align:end;padding:.5rem}#modal_close_button{padding:.5rem;background-color:#333;color:#fff;border-radius:3px;cursor:pointer}table{font-family:arial,sans-serif;border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;text-align:left;padding:8px}tr:nth-child(even){background-color:#ddd}th{background-color:#333;color:#fff;position:sticky;top:0}

<body>
    <div id="login-form-container">
        
        <form id="login-form">
            <div id="form-response">Login</div>
            <div>
                <input type="text" placeholder="Username" id="lazy_username" required>
            </div>
            <div>
                <input type="password" placeholder="Password" id="lazy_password" required>
            </div>
            <div>
                <input type="submit" value="Login">
            </div>
        </form>
    </div>
    <div class="main-container">
        <div class="wrapper">
            <div class="wrapper-title">
                <h3>Hotspot Data</h3>
            </div>
            <div class="container">
                <div id="total_user_div" class="data-div">
                    <p>Total user</p>
                    <p id="total_user"><div class="loader"></div></p>
                </div>
                <div id="total_active_div" class="data-div">
                    <p>Active</p>
                    <p id="active_user"><div class="loader"></div></p>
                </div>
                <div class="data-div">
                    <p>Total sales</p>
                    <p id="sum_daily"><div class="loader"></div></p>
                    <p id="sum_monthly"></p>
                </div>
            </div>
            <button class="accordion btn-link" style="margin-top: 1rem">Show all vendo sales</button>
            <div id="vendo-list" class="container2" style="display: none;"></div>

        </div>

        <div class="wrapper" style="margin-top: 2rem;">
            <div class="wrapper-title">
                <h3>Points Data: <small id="loyal_user_count"><div class="loader"></div</small></h3>
            </div>
            <div class="container">
                <div id="client-wrapper" class="container"></div>
            </div>
        </div>

        <div class="modal">
            <div id="modal_content">
                <table id="voucher_table">    
                </table>
            </div>
            <div id="modal_footer">
                <button type="button" id="modal_close_button">Close</button>
            </div>
        </div>

    </div>
